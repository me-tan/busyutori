<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部首アタック</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    max-width: 480px; margin: 0 auto; padding: 16px;
    background: #f4f4f6; color: #16161a;
  }
  .hidden { display: none !important; }
  .card { background: #fff; border: 1px solid #e2e2e5; border-radius: 12px; padding: 16px; }

  h1 { font-size: 28px; margin: 0 0 4px; text-align: center; }
  .tag { font-size: 13px; color: #888; margin-bottom: 22px; text-align: center; }
  .secTitle { font-size: 13px; color: #888; font-weight: 600; margin-bottom: 10px; text-align: center; }

  button {
    padding: 10px 16px; font-size: 14px; font-family: inherit; font-weight: 600;
    border: none; border-radius: 8px; cursor: pointer; background: #e8e8eb; color: #333;
  }
  button.primary { background: #2563eb; color: #fff; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .bigbtn {
    padding: 18px; font-size: 17px; border-radius: 10px;
    background: #fff; border: 2px solid #d8d8dc; color: #333; text-align: center;
  }
  .bigbtn:active { border-color: #2563eb; }
  .bigbtn small { display: block; font-size: 12px; color: #999; font-weight: 400; margin-top: 3px; }
  .back { margin-top: 16px; width: 100%; }

  .radgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px,1fr)); gap: 9px; }
  .radbtn {
    background: #fff; border: 2px solid #d8d8dc; border-radius: 10px;
    padding: 10px 4px 8px; text-align: center; cursor: pointer;
  }
  .radbtn:active { border-color: #2563eb; }
  .radbtn.done { border-color: #0a7d32; background: #f2fbf5; }
  .radbtn .r { font-size: 30px; line-height: 1.1; }
  .radbtn .n { font-size: 10px; color: #999; }
  .radbtn .c { font-size: 11px; color: #2563eb; font-weight: 700; }
  .radbtn.done .c { color: #0a7d32; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid #e2e2e5; border-radius: 12px;
    padding: 12px 16px; margin-bottom: 12px;
  }
  .lbl { font-size: 11px; color: #999; font-weight: 600; }
  .streak { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; color: #2563eb; }
  .timer.low { color: #d33; }

  .quest { background: #fff; border: 1px solid #e2e2e5; border-radius: 12px;
           padding: 14px; margin-bottom: 12px; text-align: center; }
  .radical { font-size: 66px; line-height: 1; font-weight: 700; }
  .rad-name { font-size: 14px; color: #666; margin-top: 4px; }
  .rad-meaning { font-size: 12px; color: #aaa; }

  .boxwrap { background: #fff; border: 1px solid #e2e2e5; border-radius: 12px;
             padding: 14px; margin-bottom: 12px; }
  .boxhead { display:flex; justify-content:space-between; align-items:baseline;
             font-size: 11px; color:#999; font-weight:600; margin-bottom:8px; }
  .boxhead b { font-size: 15px; color:#2563eb; }
  .boxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px,1fr)); gap: 6px; }
  .box {
    aspect-ratio: 1; border: 2px dashed #dcdce0; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; background: #fbfbfc; color: #16161a;
  }
  .box.filled { border: 2px solid #0a7d32; background: #f2fbf5; }

  .board { background: #fff; border: 1px solid #e2e2e5; border-radius: 12px;
           padding: 14px; margin-bottom: 12px; }
  #can { border: 2px solid #333; border-radius: 8px; background: #fff;
         touch-action: none; display: block; margin: 0 auto; cursor: crosshair; }
  .btns { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
  .btns .primary { flex: 1; }

  .picker { margin-top: 14px; }
  .picker-label { font-size: 12px; color: #777; font-weight: 600; margin-bottom: 8px; text-align: center; }
  .pick-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .pick { font-size: 34px; padding: 8px 16px; border: 2px solid #ccc; border-radius: 10px;
          background: #fff; cursor: pointer; line-height: 1.2; font-weight: 400; }
  .pick:active { background: #eef4ff; }
  .pick small { display: block; font-size: 11px; color: #999; font-weight: 600; }

  .msg { text-align: center; font-size: 17px; font-weight: 700; margin-top: 12px; min-height: 24px; }
  .msg.ok { color: #0a7d32; } .msg.ng { color: #c22; }

  .usedbox { background:#fff; border:1px solid #e2e2e5; border-radius:12px;
             padding:12px 14px; margin-bottom:12px; }
  .usedbox .head { display:flex; justify-content:space-between; align-items:baseline;
                   font-size:11px; color:#999; font-weight:600; margin-bottom:6px; }
  .usedlist { font-size:20px; line-height:1.6; word-break:break-all; max-height:96px; overflow-y:auto; }
  .usedlist span { margin-right:4px; color:#bbb; }
  .usedlist span.cur { color:#16161a; font-weight:700; }
  .usedempty { font-size:12px; color:#ccc; }

  .over { text-align: center; padding: 26px 16px; }
  .over h2 { font-size: 22px; margin: 0 0 8px; }
  .over .score { font-size: 60px; font-weight: 700; color: #2563eb; line-height: 1; }
  .over .score.gold { color: #0a7d32; }
  .over .unit { font-size: 15px; color: #666; margin-top: 4px; }

  .reveal { margin-top: 26px; padding-top: 20px; border-top: 1px solid #ececef; }
  .reveal-rad { font-size: 42px; font-weight: 700; line-height: 1; }
  .reveal-name { font-size: 12px; color: #999; margin-top: 2px; }
  .reveal-lead { font-size: 15px; margin: 14px 0 4px; }
  .reveal-lead b { font-size: 26px; color: #d33; }
  .reveal-sub { font-size: 12px; color: #aaa; margin-bottom: 14px; }
  .reveal-origin { font-size: 12px; color: #888; line-height: 1.6; margin-bottom: 14px; text-align: left; }
  .kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px,1fr)); gap: 8px; text-align:center; }
  .kcell { background:#fafafb; border:1px solid #ececef; border-radius:8px; padding:7px 2px 5px; }
  .kcell .k { font-size: 26px; line-height: 1.15; }
  .kcell .r { font-size: 10px; color:#999; margin-top:2px; }
  .kcell .g { font-size: 9px; color:#c4c4c8; }
  .more { font-size: 12px; color:#aaa; margin-top:10px; }
  .gotbox { margin-top: 18px; font-size: 12px; color:#999; }
  .gotbox .gk { font-size: 19px; color:#0a7d32; margin-right:4px; }

  .err { color:#c22; font-size:13px; line-height:1.8; }

  .roomcode { font-size: 40px; font-weight: 700; letter-spacing: 6px; text-align:center; }
  .codeinput { width:100%; padding:12px; font-size:20px; text-align:center; letter-spacing:6px;
               border:2px solid #d8d8dc; border-radius:8px; box-sizing:border-box; }
  .waitmsg { margin-top:10px; color:#888; font-size:14px; text-align:center; }
  .turnstatus { font-size:15px; font-weight:600; color:#2563eb; margin-bottom:8px; text-align:center; }
  .roomlabel { font-size:13px; color:#999; text-align:center; }
</style>
</head>
<body>

<div id="modeScreen" class="card">
  <h1>部首アタック</h1>
  <div class="tag">提示された部首を含む漢字を書く</div>
  <div id="loadErr" class="err hidden"></div>
  <div class="stack" id="modes">
    <button class="bigbtn" data-mode="time">タイムアタック<small>30秒以内に次々と答える。何連続できるか</small></button>
    <button class="bigbtn" data-mode="complete">コンプリート<small>ひとつの部首の漢字を、すべて書き出す</small></button>
    <button class="bigbtn" id="toBattle">オンライン対戦<small>別の端末にいる相手と部首を投げ合う</small></button>
  </div>
  <button class="back" id="openSettings" style="margin-top:14px">設定</button>
</div>

<div id="settingsScreen" class="card hidden">
  <div class="secTitle">設定</div>
  <div class="stack">
    <div>
      <div class="lbl" style="margin-bottom:8px">効果音の音量</div>
      <input type="range" id="seVolume" min="0" max="100" style="width:100%">
    </div>
    <div>
      <div class="lbl" style="margin-bottom:8px">BGMの音量</div>
      <input type="range" id="bgmVolume" min="0" max="100" style="width:100%">
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:#666">
      <input type="checkbox" id="muteAll">すべての音を消す
    </label>
  </div>
  <button class="back" id="settingsBack">もどる</button>
</div>

<div id="levelScreen" class="card hidden">
  <div class="secTitle">難易度をえらぶ</div>
  <div class="stack">
    <button class="bigbtn" data-level="low">初級<small>小1〜小3で習う漢字</small></button>
    <button class="bigbtn" data-level="elem">中級<small>小1〜小6で習う漢字</small></button>
    <button class="bigbtn" data-level="all">上級<small>常用漢字すべて</small></button>
  </div>
  <button class="back" id="lvBack">もどる</button>
</div>

<div id="radScreen" class="card hidden">
  <div class="secTitle">部首をえらぶ</div>
  <div class="radgrid" id="radGrid"></div>
  <button class="back" id="radBack">もどる</button>
</div>

<div id="playScreen" class="hidden">
  <div class="topbar" id="topbarTime">
    <div><div class="lbl">連続</div><div class="streak" id="streak">0</div></div>
    <div class="timer" id="timer">30</div>
  </div>

  <div class="quest">
    <div class="radical" id="radical">—</div>
    <div class="rad-name" id="radName"></div>
    <div class="rad-meaning" id="radMeaning"></div>
  </div>

  <div class="boxwrap hidden" id="boxwrap">
    <div class="boxhead">
      <span>あつめた漢字</span>
      <span><b id="boxDone">0</b> / <span id="boxTotal">0</span></span>
    </div>
    <div class="boxgrid" id="boxGrid"></div>
  </div>

  <div class="board">
    <canvas id="can" width="300" height="300"></canvas>
    <div class="btns">
      <button id="undo">一画戻す</button>
      <button id="erase">消す</button>
      <button id="rec" class="primary">これでいく</button>
    </div>
    <div class="picker hidden" id="picker">
      <div class="picker-label">書いた漢字を選んでください</div>
      <div class="pick-row" id="pickRow"></div>
    </div>
    <div class="msg" id="msg"></div>
    <button class="back hidden" id="passBtn">パス</button>
  </div>

  <div class="usedbox" id="usedbox">
    <div class="head"><span>使った漢字</span><span id="usedCount">0字</span></div>
    <div class="usedlist" id="usedList"><span class="usedempty">まだありません</span></div>
  </div>

  <button class="back hidden" id="giveup">ここでやめる</button>
</div>

<div id="overScreen" class="card over hidden">
  <h2 id="overTitle">時間切れ</h2>
  <div class="score" id="finalScore">0</div>
  <div class="unit" id="finalUnit">連続で答えられました</div>

  <div class="reveal" id="reveal">
    <div class="reveal-rad" id="revRad">—</div>
    <div class="reveal-name" id="revName"></div>
    <div class="reveal-lead" id="revLead"></div>
    <div class="reveal-sub" id="revSub"></div>
    <div class="reveal-origin" id="revOrigin"></div>
    <div class="kgrid" id="revGrid"></div>
    <div class="more" id="revMore"></div>
    <div class="gotbox" id="revGot"></div>
  </div>

  <div style="margin-top:24px"><button class="primary" id="retry" style="width:100%">もう一度</button></div>
  <div style="margin-top:10px"><button id="toTitle" style="width:100%">最初の画面へ</button></div>
</div>

<div id="battleSetupScreen" class="card hidden">
  <div class="secTitle">オンライン対戦</div>
  <div class="err hidden" id="battleErr"></div>

  <div class="stack" id="battleChoice">
    <button class="bigbtn" data-battle="create">部屋を作る<small>相手に伝えるコードが発行されます</small></button>
    <button class="bigbtn" data-battle="join">部屋に入る<small>相手から聞いたコードを入力します</small></button>
  </div>

  <div class="stack hidden" id="battleCreatePanel" style="margin-top:14px">
    <div class="secTitle">難易度をえらぶ</div>
    <button class="bigbtn" data-blevel="low">初級<small>小1〜小3で習う漢字</small></button>
    <button class="bigbtn" data-blevel="elem">中級<small>小1〜小6で習う漢字</small></button>
    <button class="bigbtn" data-blevel="all">上級<small>常用漢字すべて</small></button>
  </div>

  <div class="hidden" id="battleJoinPanel" style="margin-top:14px">
    <input class="codeinput" id="joinCodeInput" placeholder="部屋コード" maxlength="8">
    <button class="primary" id="joinCodeBtn" style="width:100%;margin-top:10px">入る</button>
  </div>

  <div class="hidden" id="battleWaiting" style="margin-top:18px">
    <div class="roomlabel">部屋コード</div>
    <div class="roomcode" id="roomCodeDisplay">----</div>
    <div class="waitmsg" id="waitingMsg">相手を待っています…</div>
  </div>

  <button class="back" id="battleBack">もどる</button>
</div>

<div id="battlePlayScreen" class="hidden">
  <div class="topbar">
    <div><div class="lbl">部屋</div><div class="streak" id="bRoomCode">----</div></div>
    <div class="timer" id="bTimer">-</div>
  </div>

  <div class="quest">
    <div class="turnstatus" id="bStatus">-</div>
    <div id="bRadicalBox" class="hidden">
      <div class="radical" id="bRadical">—</div>
      <div class="rad-name" id="bRadName"></div>
      <div class="rad-meaning" id="bRadMeaning"></div>
    </div>
  </div>

  <div class="boxwrap hidden" id="bOfferBox">
    <div class="boxhead"><span>部首をえらんで投げる</span></div>
    <div class="radgrid" id="bOfferRow"></div>
  </div>

  <div class="board hidden" id="bBoard">
    <canvas id="canBattle" width="300" height="300"></canvas>
    <div class="btns">
      <button id="bUndo">一画戻す</button>
      <button id="bErase">消す</button>
      <button id="bRec" class="primary">これでいく</button>
    </div>
    <div class="picker hidden" id="bPicker">
      <div class="picker-label">書いた漢字を選んでください</div>
      <div class="pick-row" id="bPickRow"></div>
    </div>
    <div class="msg" id="bMsg"></div>
  </div>

  <div class="usedbox">
    <div class="head"><span>使った漢字</span><span id="bUsedCount">0字</span></div>
    <div class="usedlist" id="bUsedList"><span class="usedempty">まだありません</span></div>
  </div>

  <button class="back hidden" id="bGiveUp">こうさんする</button>
</div>

<div id="battleOverScreen" class="card over hidden">
  <h2 id="bOverTitle">-</h2>
  <div class="unit" id="bOverUnit"></div>

  <div class="reveal" id="bReveal">
    <div class="reveal-rad" id="bRevRad">—</div>
    <div class="reveal-name" id="bRevName"></div>
    <div class="reveal-lead" id="bRevLead"></div>
    <div class="reveal-origin" id="bRevOrigin"></div>
    <div class="kgrid" id="bRevGrid"></div>
    <div class="more" id="bRevMore"></div>
    <div class="gotbox" id="bRevGot"></div>
  </div>

  <div style="margin-top:24px"><button id="bToTitle" style="width:100%">最初の画面へ</button></div>
</div>

<script src="js/vendor/kanji-canvas.js"></script>
<script src="js/vendor/ref-patterns.js"></script>
<script src="js/config.js"></script>
<script src="js/net.js"></script>
<script src="js/audio.js"></script>
<script>
"use strict";

const TIME_LIMIT = 30;
const MAX_REVEAL = 24;
const PASS_LIMIT = 3;
const OCR_SCORE_THRESHOLD = 1.6; // 最良候補の距離の何倍まで許容するか（実機でチューニングする）
const ALL_GRADES = ['1','2','3','4','5','6','8'];
const GRADES = { low:['1','2','3'], elem:['1','2','3','4','5','6'], all:ALL_GRADES };
const GLABEL = {1:'小1',2:'小2',3:'小3',4:'小4',5:'小5',6:'小6',8:'中学'};

let DATA = null;
const state = {
  mode: 'time', level: 'elem',
  used: new Set(), streak: 0,
  radical: null, recent: [],
  timeLeft: TIME_LIMIT, timerId: null, locked: false,
  target: [], startedAt: 0, passesLeft: PASS_LIMIT
};
const cleared = new Set();

async function boot() {
  try { DATA = await (await fetch('data/radicals.json')).json(); }
  catch (e) {
    const el = document.getElementById('loadErr');
    el.classList.remove('hidden');
    el.innerHTML = 'data/radicals.json が読み込めません。<br>' +
      'frontend/ ディレクトリで <code>python3 -m http.server 8000</code> を実行し、<br>' +
      '<code>http://localhost:8000/</code> を開いてください。';
    document.getElementById('modes').classList.add('hidden');
    return;
  }
  KanjiCanvas.init('can');
  KanjiCanvas.init('canBattle');
  bind();
  bBind();
}

const SCREENS = ['modeScreen','settingsScreen','levelScreen','radScreen','playScreen','overScreen',
  'battleSetupScreen','battlePlayScreen','battleOverScreen'];
const BGM_SCREENS = new Set(['modeScreen','settingsScreen','levelScreen','radScreen',
  'overScreen','battleSetupScreen','battleOverScreen']);
function show(id) {
  SCREENS.forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
  if (BGM_SCREENS.has(id)) KBAudio.playBgm('menu'); else KBAudio.stopBgm();
}

function poolOf(rad, grades) {
  const d = DATA.radicals[rad];
  let ks = [];
  for (const g of grades) if (d.kanji[g]) ks = ks.concat(d.kanji[g]);
  return ks;
}
function gradesNow() { return GRADES[state.level]; }
function firstReading(k) {
  const d = DATA.kanji[k];
  if (!d) return '';
  if (d.kun && d.kun.length) return d.kun[0];
  if (d.on && d.on.length) return d.on[0];
  return '';
}

function renderRadicalList() {
  const g = gradesNow();
  const list = Object.keys(DATA.radicals)
    .map(r => ({ r, n: poolOf(r, g).length }))
    .filter(x => x.n >= 3)
    .sort((a, b) => a.n - b.n);

  document.getElementById('radGrid').innerHTML = list.map(x => {
    const d = DATA.radicals[x.r];
    const done = cleared.has(state.level + ':' + x.r);
    return `<div class="radbtn ${done ? 'done' : ''}" data-rad="${x.r}">` +
           `<div class="r">${x.r}</div><div class="n">${d.name}</div>` +
           `<div class="c">${done ? '達成' : x.n + '字'}</div></div>`;
  }).join('');

  document.querySelectorAll('.radbtn').forEach(el => {
    el.onclick = () => startComplete(el.dataset.rad);
  });
}

function weightedPick(items, weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) {
    r -= weights[i];
    if (r <= 0) return items[i];
  }
  return items[items.length - 1];
}

function pickRadical() {
  const g = gradesNow();
  let list = Object.keys(DATA.radicals)
    .map(r => ({ r, n: poolOf(r, g).filter(k => !state.used.has(k)).length }))
    .filter(x => x.n >= 5);
  const fresh = list.filter(x => !state.recent.includes(x.r));
  if (fresh.length) list = fresh;
  if (!list.length) return null;

  // 残り字数が多い部首ほど出やすくする（少ない部首は早めに使い切られて選択肢から消えていく）
  const rad = weightedPick(list.map(x => x.r), list.map(x => x.n));
  setRadical(rad);
  state.recent.push(rad);
  if (state.recent.length > 2) state.recent.shift();
  return rad;
}

function setRadical(rad) {
  state.radical = rad;
  const d = DATA.radicals[rad];
  document.getElementById('radical').textContent = rad;
  document.getElementById('radName').textContent = d.name;
  document.getElementById('radMeaning').textContent = d.meaning;
}

function startTime(level) {
  state.mode = 'time'; state.level = level;
  state.used = new Set(); state.streak = 0; state.recent = [];
  state.passesLeft = PASS_LIMIT;
  document.getElementById('streak').textContent = '0';
  document.getElementById('topbarTime').classList.remove('hidden');
  document.getElementById('boxwrap').classList.add('hidden');
  document.getElementById('usedbox').classList.remove('hidden');
  document.getElementById('giveup').classList.add('hidden');
  document.getElementById('passBtn').classList.remove('hidden');
  renderPassBtn();
  renderUsed();
  show('playScreen');
  nextTurn();
}

function startComplete(rad) {
  state.mode = 'complete';
  state.used = new Set(); state.streak = 0;
  state.target = poolOf(rad, gradesNow()).slice()
    .sort((a,b) => (DATA.kanji[a].grade - DATA.kanji[b].grade));
  state.startedAt = Date.now();
  setRadical(rad);
  document.getElementById('topbarTime').classList.add('hidden');
  document.getElementById('boxwrap').classList.remove('hidden');
  document.getElementById('usedbox').classList.add('hidden');
  document.getElementById('giveup').classList.remove('hidden');
  document.getElementById('passBtn').classList.add('hidden');
  document.getElementById('boxTotal').textContent = state.target.length;
  renderBoxes();
  state.locked = false;
  clearBoard();
  show('playScreen');
}

function renderBoxes() {
  document.getElementById('boxDone').textContent = state.used.size;
  document.getElementById('boxGrid').innerHTML = state.target.map(k => {
    const got = state.used.has(k);
    return `<div class="box ${got ? 'filled' : ''}">${got ? k : ''}</div>`;
  }).join('');
}

function renderPassBtn() {
  const btn = document.getElementById('passBtn');
  btn.textContent = `パス（残り${state.passesLeft}）`;
  btn.disabled = state.passesLeft <= 0;
}

function doPass() {
  if (state.mode !== 'time' || state.locked || state.passesLeft <= 0) return;
  state.passesLeft--;
  renderPassBtn();
  nextTurn();
}

function nextTurn() {
  state.locked = false;
  clearBoard();
  if (!pickRadical()) { gameOver('exhausted'); return; }
  renderUsed();
  startTimer();
}

function clearBoard() {
  KanjiCanvas.erase('can');
  document.getElementById('picker').classList.add('hidden');
  document.getElementById('pickRow').innerHTML = '';
  setMsg('', '');
}
function setMsg(t, c) {
  const el = document.getElementById('msg');
  el.textContent = t; el.className = 'msg' + (c ? ' ' + c : '');
  if (c === 'ng') KBAudio.play('incorrect');
}

function startTimer() {
  clearInterval(state.timerId);
  state.timeLeft = TIME_LIMIT;
  renderTimer();
  state.timerId = setInterval(() => {
    state.timeLeft--; renderTimer();
    if (state.timeLeft > 0 && state.timeLeft <= 5) KBAudio.play('tick');
    if (state.timeLeft <= 0) { clearInterval(state.timerId); gameOver('timeup'); }
  }, 1000);
}
function renderTimer() {
  const el = document.getElementById('timer');
  el.textContent = state.timeLeft;
  el.classList.toggle('low', state.timeLeft <= 5);
}

function scoredCandidates(id) {
  KanjiCanvas.recognize(id);
  const scored = KanjiCanvas.lastScored || [];
  if (!scored.length) return [];
  const best = scored[0][1];
  return scored.filter(([, dist]) => dist <= best * OCR_SCORE_THRESHOLD).slice(0, 6).map(([k]) => k);
}

function judge() {
  if (state.locked) return;
  const cands = scoredCandidates('can');

  const inLevel = state.mode === 'complete'
    ? new Set(state.target)
    : new Set(poolOf(state.radical, gradesNow()));
  const allPool = new Set(poolOf(state.radical, ALL_GRADES));

  const valid = [], dupes = [], over = [];
  for (const c of cands) {
    if (inLevel.has(c)) {
      if (state.used.has(c)) { if (!dupes.includes(c)) dupes.push(c); }
      else if (!valid.includes(c)) valid.push(c);
    } else if (allPool.has(c) && !over.includes(c)) over.push(c);
  }

  const picker = document.getElementById('picker');
  const row = document.getElementById('pickRow');
  row.innerHTML = '';

  if (!valid.length) {
    picker.classList.add('hidden');
    if (dupes.length) setMsg(`「${dupes.join('・')}」はもう書きました`, 'ng');
    else if (over.length) {
      const k = over[0], g = DATA.kanji[k] ? DATA.kanji[k].grade : null;
      setMsg(`「${k}」は${g ? GLABEL[g] : '範囲外'}で習う漢字です`, 'ng');
    } else if (cands.length) {
      setMsg(`「${[...new Set(cands)].join('・')}」と認識しました。この部首を含む漢字ではありません`, 'ng');
    } else setMsg('文字を認識できませんでした。もう一度書いてみてください', 'ng');
    return;
  }

  setMsg('', '');
  picker.classList.remove('hidden');
  for (const k of valid) {
    const b = document.createElement('button');
    b.className = 'pick';
    const g = DATA.kanji[k] ? DATA.kanji[k].grade : '';
    b.innerHTML = k + '<small>' + (GLABEL[g] || '') + '</small>';
    b.onclick = () => accept(k);
    row.appendChild(b);
  }
}

function accept(k) {
  if (state.locked) return;
  state.locked = true;
  clearInterval(state.timerId);
  state.used.add(k);
  document.getElementById('picker').classList.add('hidden');
  setMsg(k + '  正解', 'ok');
  KBAudio.play('correct');

  if (state.mode === 'complete') {
    renderBoxes();
    if (state.used.size >= state.target.length) {
      cleared.add(state.level + ':' + state.radical);
      setTimeout(() => gameOver('complete'), 700);
      return;
    }
    setTimeout(() => { state.locked = false; clearBoard(); }, 700);
  } else {
    state.streak++;
    document.getElementById('streak').textContent = state.streak;
    renderUsed();
    setTimeout(nextTurn, 800);
  }
}

function renderUsed() {
  const el = document.getElementById('usedList');
  document.getElementById('usedCount').textContent = state.used.size + '字';
  if (!state.used.size) { el.innerHTML = '<span class="usedempty">まだありません</span>'; return; }
  const cur = state.radical ? new Set(poolOf(state.radical, ALL_GRADES)) : new Set();
  el.innerHTML = [...state.used].map(k => `<span class="${cur.has(k) ? 'cur' : ''}">${k}</span>`).join('');
}

function cellHTML(k) {
  const g = DATA.kanji[k] ? DATA.kanji[k].grade : '';
  return `<div class="kcell"><div class="k">${k}</div>` +
         `<div class="r">${firstReading(k)}</div>` +
         `<div class="g">${GLABEL[g] || ''}</div></div>`;
}

function renderReveal() {
  const rad = state.radical;
  const box = document.getElementById('reveal');
  if (!rad) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');

  const d = DATA.radicals[rad];
  const pool = state.mode === 'complete' ? state.target : poolOf(rad, gradesNow());
  const unused = pool.filter(k => !state.used.has(k));
  const got = pool.filter(k => state.used.has(k));

  document.getElementById('revRad').textContent = rad;
  document.getElementById('revName').textContent = d.name;
  document.getElementById('revSub').textContent = d.meaning;
  document.getElementById('revOrigin').textContent = d.origin ? `なりたち: ${d.origin}` : '';

  if (!unused.length) {
    document.getElementById('revLead').innerHTML = `${rad}を含む漢字を、すべて書き出しました`;
    document.getElementById('revGrid').innerHTML = got.map(cellHTML).join('');
    document.getElementById('revMore').textContent = '';
    document.getElementById('revGot').innerHTML = '';
    return;
  }

  document.getElementById('revLead').innerHTML =
    `${rad}を含む漢字は、まだ <b>${unused.length}</b> 字ありました`;

  const sorted = unused.slice().sort((a,b) =>
    (DATA.kanji[a] ? DATA.kanji[a].grade : 99) - (DATA.kanji[b] ? DATA.kanji[b].grade : 99));
  const shown = sorted.slice(0, MAX_REVEAL);
  document.getElementById('revGrid').innerHTML = shown.map(cellHTML).join('');
  const rest = sorted.length - shown.length;
  document.getElementById('revMore').textContent = rest > 0 ? `ほか ${rest} 字` : '';
  document.getElementById('revGot').innerHTML = got.length
    ? 'あなたが書けたのは ' + got.map(k => `<span class="gk">${k}</span>`).join('') + ` の ${got.length} 字`
    : '';
}

function gameOver(reason) {
  clearInterval(state.timerId);
  state.locked = true;
  const title = document.getElementById('overTitle');
  const score = document.getElementById('finalScore');
  const unit  = document.getElementById('finalUnit');
  score.classList.remove('gold');

  if (state.mode === 'complete') {
    if (reason === 'complete') {
      const sec = Math.round((Date.now() - state.startedAt) / 1000);
      const m = Math.floor(sec / 60), s = sec % 60;
      title.textContent = 'コンプリート';
      score.textContent = state.target.length;
      score.classList.add('gold');
      unit.textContent = `字すべて書けました（${m}分${s}秒）`;
      KBAudio.play('victory');
    } else {
      title.textContent = 'とちゅうでやめました';
      score.textContent = state.used.size;
      unit.textContent = `/ ${state.target.length} 字`;
    }
  } else {
    title.textContent = reason === 'exhausted' ? '出せる部首がなくなりました' : '時間切れ';
    score.textContent = state.streak;
    unit.textContent = '連続で答えられました';
    if (reason === 'timeup') KBAudio.play('timeup');
  }
  renderReveal();
  show('overScreen');
}

function renderSettingsUI() {
  const s = KBAudio.getSettings();
  document.getElementById('seVolume').value = Math.round(s.se * 100);
  document.getElementById('bgmVolume').value = Math.round(s.bgm * 100);
  document.getElementById('muteAll').checked = s.muted;
}

function bind() {
  document.querySelectorAll('#modes .bigbtn[data-mode]').forEach(b => {
    b.onclick = () => { state.mode = b.dataset.mode; show('levelScreen'); };
  });
  document.getElementById('toBattle').onclick = () => { bReset(); show('battleSetupScreen'); };
  document.querySelectorAll('#levelScreen .bigbtn').forEach(b => {
    b.onclick = () => {
      state.level = b.dataset.level;
      if (state.mode === 'complete') { renderRadicalList(); show('radScreen'); }
      else startTime(state.level);
    };
  });
  document.getElementById('lvBack').onclick  = () => show('modeScreen');
  document.getElementById('radBack').onclick = () => show('levelScreen');

  document.getElementById('rec').onclick = judge;
  document.getElementById('erase').onclick = () => {
    KanjiCanvas.erase('can');
    document.getElementById('picker').classList.add('hidden');
    setMsg('', '');
  };
  document.getElementById('undo').onclick = () => KanjiCanvas.deleteLast('can');
  document.getElementById('giveup').onclick = () => gameOver('giveup');
  document.getElementById('passBtn').onclick = doPass;

  document.getElementById('retry').onclick = () => {
    if (state.mode === 'complete') startComplete(state.radical);
    else startTime(state.level);
  };
  document.getElementById('toTitle').onclick = () => show('modeScreen');

  document.getElementById('openSettings').onclick = () => { renderSettingsUI(); show('settingsScreen'); };
  document.getElementById('settingsBack').onclick = () => show('modeScreen');
  document.getElementById('seVolume').oninput = e => KBAudio.setSeVolume(e.target.value / 100);
  document.getElementById('bgmVolume').oninput = e => {
    KBAudio.setBgmVolume(e.target.value / 100);
  };
  document.getElementById('muteAll').onchange = e => KBAudio.setMuted(e.target.checked);

  document.addEventListener('click', e => {
    if (e.target.closest('button')) KBAudio.play('tap');
  });
}

/* ---------------- オンライン対戦 ---------------- */

const bstate = {
  code: null, myId: null, level: null,
  radical: null, deadline: 0, tickId: null,
  isDefending: false, used: [], locked: false,
};

function bReset() {
  Net.close();
  bstate.code = null; bstate.myId = null; bstate.level = null;
  bstate.radical = null; bstate.deadline = 0; bstate.used = []; bstate.locked = false;
  clearInterval(bstate.tickId);
  document.getElementById('battleChoice').classList.remove('hidden');
  document.getElementById('battleCreatePanel').classList.add('hidden');
  document.getElementById('battleJoinPanel').classList.add('hidden');
  document.getElementById('battleWaiting').classList.add('hidden');
  bSetErr('');
}

function bSetErr(t) {
  const el = document.getElementById('battleErr');
  if (!t) { el.classList.add('hidden'); el.textContent = ''; return; }
  el.classList.remove('hidden'); el.textContent = t;
}

async function bCreateRoom(level) {
  bSetErr('');
  try {
    const room = await Net.createRoom(level);
    bstate.code = room.code; bstate.myId = room.player_id; bstate.level = level;
    bEnterWaiting('相手を待っています…');
    bConnect();
  } catch (e) {
    bSetErr('部屋を作れませんでした。通信環境を確認してください。');
  }
}

async function bJoinRoom(code) {
  bSetErr('');
  try {
    const room = await Net.joinRoom(code);
    bstate.code = room.code; bstate.myId = room.player_id; bstate.level = room.level;
    bEnterWaiting('対戦を開始しています…');
    bConnect();
  } catch (e) {
    bSetErr('その部屋には入れませんでした。コードを確認してください。');
  }
}

function bEnterWaiting(msg) {
  document.getElementById('battleChoice').classList.add('hidden');
  document.getElementById('battleCreatePanel').classList.add('hidden');
  document.getElementById('battleJoinPanel').classList.add('hidden');
  document.getElementById('battleWaiting').classList.remove('hidden');
  document.getElementById('roomCodeDisplay').textContent = bstate.code;
  document.getElementById('waitingMsg').textContent = msg;
}

function bConnect() {
  Net.connect(bstate.code, bstate.myId);
  Net.on('start', onBStart);
  Net.on('offer', onBOffer);
  Net.on('defend', onBDefend);
  Net.on('answer_rejected', onBRejected);
  Net.on('turn_result', onBTurnResult);
  Net.on('game_over', onBGameOver);
  Net.on('closed', () => bSetErr('通信が切れました。もう一度お試しください。'));
}

function onBStart() {
  document.getElementById('bRoomCode').textContent = bstate.code;
  document.getElementById('bGiveUp').classList.add('hidden');
  bRenderUsed();
  show('battlePlayScreen');
  KBAudio.play('start');
}

function onBOffer(msg) {
  clearInterval(bstate.tickId);
  bstate.locked = false;
  bstate.used = msg.used || [];
  bRenderUsed();
  KanjiCanvas.erase('canBattle');
  document.getElementById('bPicker').classList.add('hidden');
  bSetMsg('', '');

  const iAmAttacker = msg.attacker === bstate.myId;
  document.getElementById('bOfferBox').classList.toggle('hidden', !iAmAttacker);
  document.getElementById('bBoard').classList.add('hidden');
  document.getElementById('bRadicalBox').classList.add('hidden');
  document.getElementById('bTimer').textContent = '-';

  if (iAmAttacker) {
    document.getElementById('bStatus').textContent = '部首をえらんで、相手に投げてください';
    document.getElementById('bOfferRow').innerHTML = msg.choices.map(c =>
      `<div class="radbtn" data-radical="${c.radical}">` +
      `<div class="r">${c.radical}</div><div class="n">${c.name}</div></div>`
    ).join('');
    document.querySelectorAll('#bOfferRow .radbtn').forEach(el => {
      el.onclick = () => {
        document.getElementById('bOfferBox').classList.add('hidden');
        document.getElementById('bStatus').textContent = '相手が書くのを待っています…';
        Net.send('throw', { radical: el.dataset.radical });
      };
    });
  } else {
    document.getElementById('bStatus').textContent = '相手が部首をえらんでいます…';
  }
}

function onBDefend(msg) {
  bstate.radical = msg.radical;
  bstate.isDefending = msg.defender === bstate.myId;
  bstate.deadline = Date.now() + msg.seconds * 1000;

  const d = DATA.radicals[msg.radical];
  document.getElementById('bRadicalBox').classList.remove('hidden');
  document.getElementById('bRadical').textContent = msg.radical;
  document.getElementById('bRadName').textContent = d.name;
  document.getElementById('bRadMeaning').textContent = d.meaning;
  document.getElementById('bOfferBox').classList.add('hidden');

  if (bstate.isDefending) {
    document.getElementById('bStatus').textContent = '20秒以内に、この部首を含む漢字を書いてください';
    document.getElementById('bBoard').classList.remove('hidden');
    document.getElementById('bGiveUp').classList.remove('hidden');
    KanjiCanvas.erase('canBattle');
  } else {
    document.getElementById('bStatus').textContent = '相手が書いています…';
    document.getElementById('bGiveUp').classList.add('hidden');
  }
  bTick();
}

function bTick() {
  clearInterval(bstate.tickId);
  const render = () => {
    const left = Math.max(0, Math.ceil((bstate.deadline - Date.now()) / 1000));
    const el = document.getElementById('bTimer');
    el.textContent = left;
    el.classList.toggle('low', left <= 5);
    if (left <= 0) clearInterval(bstate.tickId);
  };
  render();
  bstate.tickId = setInterval(render, 250);
}

function bJudge() {
  if (bstate.locked || !bstate.isDefending) return;
  const cands = scoredCandidates('canBattle');
  const grades = GRADES[bstate.level];
  const inRange = new Set(poolOf(bstate.radical, grades));
  const usedSet = new Set(bstate.used);

  const valid = [], dupes = [], other = [];
  for (const c of cands) {
    if (inRange.has(c)) {
      if (usedSet.has(c)) { if (!dupes.includes(c)) dupes.push(c); }
      else if (!valid.includes(c)) valid.push(c);
    } else if (!other.includes(c)) other.push(c);
  }

  const picker = document.getElementById('bPicker');
  const row = document.getElementById('bPickRow');
  row.innerHTML = '';

  if (!valid.length) {
    picker.classList.add('hidden');
    if (dupes.length) bSetMsg(`「${dupes.join('・')}」はもう書きました`, 'ng');
    else if (cands.length) {
      bSetMsg(`「${[...new Set(cands)].join('・')}」と認識しました。この部首を含む漢字ではありません`, 'ng');
    } else bSetMsg('文字を認識できませんでした。もう一度書いてみてください', 'ng');
    return;
  }

  bSetMsg('', '');
  picker.classList.remove('hidden');
  for (const k of valid) {
    const b = document.createElement('button');
    b.className = 'pick';
    const g = DATA.kanji[k] ? DATA.kanji[k].grade : '';
    b.innerHTML = k + '<small>' + (GLABEL[g] || '') + '</small>';
    b.onclick = () => bSubmit(k);
    row.appendChild(b);
  }
}

function bSubmit(kanji) {
  if (bstate.locked) return;
  bstate.locked = true;
  document.getElementById('bPicker').classList.add('hidden');
  bSetMsg(kanji + '  送信しました', 'ok');
  Net.send('answer', { kanji });
}

function onBRejected(msg) {
  bstate.locked = false;
  const why = { used: 'もう使われています', out_of_grade: '選んだ難易度の範囲外です', not_in_radical: 'その部首を含みません' };
  bSetMsg(`「${msg.kanji}」は${why[msg.reason] || '認められませんでした'}`, 'ng');
}

function onBTurnResult(msg) {
  clearInterval(bstate.tickId);
  bstate.used = msg.used || [];
  bRenderUsed();
  KBAudio.play('correct');
}

function onBGameOver(msg) {
  clearInterval(bstate.tickId);
  Net.close();
  const iLost = msg.loser === bstate.myId;
  const title = document.getElementById('bOverTitle');
  const unit = document.getElementById('bOverUnit');

  const REASON_TEXT = {
    timeout: iLost ? '時間切れで負けました' : '相手が時間切れ。あなたの勝ちです',
    give_up: iLost ? 'こうさんしました' : '相手がこうさん。あなたの勝ちです',
    disconnect: '相手との通信が切れました',
    exhausted: '出せる部首がなくなりました（引き分け）',
  };
  title.textContent = REASON_TEXT[msg.reason] || '対戦終了';
  unit.textContent = '';
  if (msg.reason === 'timeout' || msg.reason === 'give_up') {
    KBAudio.play(iLost ? 'timeup' : 'victory');
  }

  const box = document.getElementById('bReveal');
  if (!msg.reveal) {
    box.classList.add('hidden');
  } else {
    box.classList.remove('hidden');
    const { radical, unused, got } = msg.reveal;
    const d = DATA.radicals[radical];
    document.getElementById('bRevRad').textContent = radical;
    document.getElementById('bRevName').textContent = d.name;
    document.getElementById('bRevOrigin').textContent = d.origin ? `なりたち: ${d.origin}` : '';

    if (!unused.length) {
      document.getElementById('bRevLead').innerHTML = `${radical}を含む漢字は、すべて使われました`;
      document.getElementById('bRevGrid').innerHTML = got.map(cellHTML).join('');
      document.getElementById('bRevMore').textContent = '';
      document.getElementById('bRevGot').innerHTML = '';
    } else {
      document.getElementById('bRevLead').innerHTML =
        `${radical}を含む漢字は、まだ <b>${unused.length}</b> 字ありました`;
      const sorted = unused.slice().sort((a, b) =>
        (DATA.kanji[a] ? DATA.kanji[a].grade : 99) - (DATA.kanji[b] ? DATA.kanji[b].grade : 99));
      const shown = sorted.slice(0, MAX_REVEAL);
      document.getElementById('bRevGrid').innerHTML = shown.map(cellHTML).join('');
      const rest = sorted.length - shown.length;
      document.getElementById('bRevMore').textContent = rest > 0 ? `ほか ${rest} 字` : '';
      document.getElementById('bRevGot').innerHTML = got.length
        ? '書かれたのは ' + got.map(k => `<span class="gk">${k}</span>`).join('') + ` の ${got.length} 字`
        : '';
    }
  }
  show('battleOverScreen');
}

function bSetMsg(t, c) {
  const el = document.getElementById('bMsg');
  el.textContent = t; el.className = 'msg' + (c ? ' ' + c : '');
  if (c === 'ng') KBAudio.play('incorrect');
}

function bRenderUsed() {
  const el = document.getElementById('bUsedList');
  document.getElementById('bUsedCount').textContent = bstate.used.length + '字';
  if (!bstate.used.length) { el.innerHTML = '<span class="usedempty">まだありません</span>'; return; }
  el.innerHTML = bstate.used.map(k => `<span>${k}</span>`).join('');
}

function bBind() {
  document.querySelectorAll('#battleChoice .bigbtn').forEach(b => {
    b.onclick = () => {
      document.getElementById('battleChoice').classList.add('hidden');
      document.getElementById(b.dataset.battle === 'create' ? 'battleCreatePanel' : 'battleJoinPanel')
        .classList.remove('hidden');
    };
  });
  document.querySelectorAll('#battleCreatePanel .bigbtn').forEach(b => {
    b.onclick = () => bCreateRoom(b.dataset.blevel);
  });
  document.getElementById('joinCodeBtn').onclick = () => {
    const code = document.getElementById('joinCodeInput').value.trim();
    if (code) bJoinRoom(code);
  };
  document.getElementById('battleBack').onclick = () => { bReset(); show('modeScreen'); };

  document.getElementById('bRec').onclick = bJudge;
  document.getElementById('bErase').onclick = () => {
    KanjiCanvas.erase('canBattle');
    document.getElementById('bPicker').classList.add('hidden');
    bSetMsg('', '');
  };
  document.getElementById('bUndo').onclick = () => KanjiCanvas.deleteLast('canBattle');
  document.getElementById('bGiveUp').onclick = () => {
    if (bstate.isDefending) Net.send('give_up', {});
  };
  document.getElementById('bToTitle').onclick = () => { bReset(); show('modeScreen'); };
}

boot();
</script>
