<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぶしゅとり 判定テスト v2</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    max-width: 560px; margin: 0 auto; padding: 20px;
    background: #f6f6f7; color: #16161a;
  }
  h1 { font-size: 17px; margin: 0 0 14px; }
  .card {
    background: #fff; border: 1px solid #e2e2e5; border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .radical { font-size: 60px; line-height: 1; font-weight: 700; }
  .radical-name { font-size: 13px; color: #666; }
  .radical-meaning { font-size: 12px; color: #999; }
  .timer { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; color: #2563eb; }
  .timer.low { color: #c22; }
  .remain { font-size: 12px; color: #999; text-align: right; }
  #can {
    border: 2px solid #333; border-radius: 8px; background: #fff;
    touch-action: none; display: block; margin: 0 auto; cursor: crosshair;
  }
  .btns { display: flex; gap: 8px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    padding: 9px 16px; font-size: 14px; font-family: inherit; font-weight: 600;
    border: none; border-radius: 6px; cursor: pointer; background: #e6e6e9; color: #333;
  }
  button.primary { background: #2563eb; color: #fff; }
  .picker { margin-top: 14px; }
  .picker-label { font-size: 12px; color: #777; font-weight: 600; margin-bottom: 8px; text-align: center; }
  .pick-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .pick {
    font-size: 34px; padding: 10px 16px; border: 2px solid #ccc; border-radius: 10px;
    background: #fff; cursor: pointer; line-height: 1.2; font-weight: 400;
  }
  .pick:hover { border-color: #2563eb; background: #eef4ff; }
  .pick small { display: block; font-size: 11px; color: #888; font-weight: 600; }
  .verdict { text-align: center; font-size: 20px; font-weight: 700; margin-top: 12px; min-height: 28px; }
  .ok { color: #0a7d32; } .ng { color: #c22; }
  .diag { font-size: 12px; color: #888; text-align: center; margin-top: 10px; line-height: 1.7; word-break: break-all; }
  .used { font-size: 15px; line-height: 2; letter-spacing: 3px; word-break: break-all; }
  .label { font-size: 12px; color: #777; font-weight: 600; margin-bottom: 6px; }
  select { padding: 6px 8px; font-size: 14px; font-family: inherit; border-radius: 6px; border: 1px solid #ccc; }
  .note { font-size: 12px; color: #777; line-height: 1.8; }
  #status { font-size: 13px; }
  .statbox { font-size: 13px; line-height: 1.9; }
  .statbox b { color: #2563eb; font-size: 16px; }
</style>
</head>
<body>

<h1>ぶしゅとり 判定テスト v2</h1>

<div class="card" id="status">読み込み中...</div>

<div class="card">
  <div class="label">難易度</div>
  <select id="level">
    <option value="low">初級（小1〜3）</option>
    <option value="elem" selected>中級（小1〜6）</option>
    <option value="all">上級（全常用）</option>
  </select>
  <button id="next" style="margin-left:8px">次の部首</button>
  <label style="margin-left:8px; font-size:13px;">
    <input type="checkbox" id="useTimer"> 20秒タイマー
  </label>
</div>

<div class="card">
  <div class="head">
    <div>
      <div class="radical" id="radical">—</div>
      <div class="radical-name" id="radName"></div>
      <div class="radical-meaning" id="radMeaning"></div>
    </div>
    <div>
      <div class="timer" id="timer">—</div>
      <div class="remain" id="remain"></div>
    </div>
  </div>
</div>

<div class="card">
  <canvas id="can" width="300" height="300"></canvas>
  <div class="btns">
    <button id="undo">一画戻す</button>
    <button id="erase">全部消す</button>
    <button id="rec" class="primary">判定する</button>
  </div>

  <div class="picker" id="picker" style="display:none">
    <div class="picker-label">書いた漢字を選んでください</div>
    <div class="pick-row" id="pickRow"></div>
  </div>

  <div class="verdict" id="verdict"></div>
  <div class="diag" id="diag"></div>
</div>

<div class="card">
  <div class="label">計測結果</div>
  <div class="statbox" id="stats">まだ試行がありません</div>
</div>

<div class="card">
  <div class="label">使用済み漢字</div>
  <div class="used" id="used">（まだありません）</div>
</div>

<div class="card">
  <div class="note">
    <strong>確認したいこと</strong><br>
    ・<strong>該当候補の平均個数</strong>（計測結果に出ます）。1〜2個なら選択の負担は軽い<br>
    ・タップ1回で確定する流れが、20秒の中でストレスにならないか<br>
    ・書いた字が該当候補に入らないこと（＝取りこぼし）がどれくらいあるか<br>
    ・タイマーをオンにして、20秒で何字答えられるか
  </div>
</div>

<script src="kanji-canvas.js"></script>
<script src="ref-patterns.js"></script>
<script>
let DATA = null, currentRadical = null;
let used = new Set();
let timerId = null, timeLeft = 20;
const stat = { tries: 0, validSum: 0, rawSum: 0, zero: 0, one: 0, multi: 0, msSum: 0 };

const GRADES = { low:['1','2','3'], elem:['1','2','3','4','5','6'], all:['1','2','3','4','5','6','8'] };
const GLABEL = {1:'小1',2:'小2',3:'小3',4:'小4',5:'小5',6:'小6',8:'中学'};

async function load() {
  const st = document.getElementById('status');
  try {
    DATA = await (await fetch('radicals.json')).json();
    st.innerHTML = `部首 ${DATA.meta.radicalCount} 種 / 漢字 ${DATA.meta.kanjiCount} 字`;
  } catch (e) {
    st.innerHTML = '<span style="color:#c22">radicals.json が読めません。</span><br>' +
      '同じフォルダに radicals.json / kanji-canvas.js / ref-patterns.js を置き、<br>' +
      '<code>python3 -m http.server 8000</code> を実行して<br>' +
      'http://localhost:8000/hanteitest2.html を開いてください。';
    return;
  }
  KanjiCanvas.init('can');
  pickRadical();
}

function poolOf(rad, grades) {
  const d = DATA.radicals[rad];
  let ks = [];
  for (const g of grades) if (d.kanji[g]) ks = ks.concat(d.kanji[g]);
  return ks;
}
function grades() { return GRADES[document.getElementById('level').value]; }

function pickRadical() {
  const g = grades();
  const list = Object.keys(DATA.radicals).filter(r => poolOf(r, g).filter(k => !used.has(k)).length >= 5);
  currentRadical = list[Math.floor(Math.random() * list.length)];
  const d = DATA.radicals[currentRadical];
  document.getElementById('radical').textContent = currentRadical;
  document.getElementById('radName').textContent = d.name;
  document.getElementById('radMeaning').textContent = d.meaning;
  updateRemain();
  reset();
  if (document.getElementById('useTimer').checked) startTimer();
}

function updateRemain() {
  const pool = poolOf(currentRadical, grades());
  const left = pool.filter(k => !used.has(k)).length;
  document.getElementById('remain').textContent = `残り ${left} / ${pool.length} 字`;
}

function reset() {
  KanjiCanvas.erase('can');
  document.getElementById('picker').style.display = 'none';
  document.getElementById('verdict').textContent = '';
  document.getElementById('diag').textContent = '';
}

function startTimer() {
  clearInterval(timerId);
  timeLeft = 20;
  const el = document.getElementById('timer');
  el.textContent = timeLeft;
  el.className = 'timer';
  timerId = setInterval(() => {
    timeLeft--;
    el.textContent = timeLeft;
    if (timeLeft <= 5) el.className = 'timer low';
    if (timeLeft <= 0) {
      clearInterval(timerId);
      const v = document.getElementById('verdict');
      v.textContent = '時間切れ';
      v.className = 'verdict ng';
    }
  }, 1000);
}

document.getElementById('erase').onclick = reset;
document.getElementById('undo').onclick = () => KanjiCanvas.deleteLast('can');
document.getElementById('next').onclick = pickRadical;
document.getElementById('level').onchange = pickRadical;
document.getElementById('useTimer').onchange = e => {
  if (e.target.checked) startTimer();
  else { clearInterval(timerId); document.getElementById('timer').textContent = '—'; }
};

document.getElementById('rec').onclick = () => {
  if (!DATA) return;
  const t0 = performance.now();
  const raw = KanjiCanvas.recognize('can');
  const ms = performance.now() - t0;

  const cands = String(raw || '').trim().split(/\s+/).filter(Boolean);
  const pool = new Set(poolOf(currentRadical, grades()));

  // 該当候補 = その部首を含む・未使用・重複なし（認識順を保持）
  const valid = [];
  const dupes = [];
  for (const c of cands) {
    if (!pool.has(c)) continue;
    if (used.has(c)) { if (!dupes.includes(c)) dupes.push(c); continue; }
    if (!valid.includes(c)) valid.push(c);
  }

  // 統計
  stat.tries++; stat.rawSum += cands.length; stat.validSum += valid.length; stat.msSum += ms;
  if (valid.length === 0) stat.zero++; else if (valid.length === 1) stat.one++; else stat.multi++;
  renderStats();

  document.getElementById('diag').innerHTML =
    `全候補 ${cands.length} 個: ${cands.join(' ')}<br>` +
    `該当候補 ${valid.length} 個 / 使用済みで除外 ${dupes.length} 個 / ${ms.toFixed(0)}ms`;

  const picker = document.getElementById('picker');
  const row = document.getElementById('pickRow');
  const v = document.getElementById('verdict');
  row.innerHTML = '';

  if (valid.length === 0) {
    picker.style.display = 'none';
    if (dupes.length) { v.textContent = `「${dupes.join('・')}」はもう使いました`; }
    else { v.textContent = `${currentRadical} の漢字が候補にありません`; }
    v.className = 'verdict ng';
    return;
  }

  v.textContent = '';
  picker.style.display = '';
  for (const k of valid) {
    const b = document.createElement('button');
    b.className = 'pick';
    const g = DATA.kanji[k] ? DATA.kanji[k].grade : '';
    b.innerHTML = k + '<small>' + (GLABEL[g] || '') + '</small>';
    b.onclick = () => confirmPick(k);
    row.appendChild(b);
  }
};

function confirmPick(k) {
  used.add(k);
  renderUsed();
  updateRemain();
  const v = document.getElementById('verdict');
  v.textContent = `正解  ${k}`;
  v.className = 'verdict ok';
  document.getElementById('picker').style.display = 'none';
  setTimeout(() => {
    reset();
    if (document.getElementById('useTimer').checked) startTimer();
  }, 700);
}

function renderStats() {
  const s = stat;
  document.getElementById('stats').innerHTML =
    `試行 <b>${s.tries}</b> 回<br>` +
    `該当候補の平均 <b>${(s.validSum / s.tries).toFixed(2)}</b> 個 ` +
    `（全候補の平均 ${(s.rawSum / s.tries).toFixed(1)} 個）<br>` +
    `該当0個: ${s.zero} 回 / 1個: ${s.one} 回 / 2個以上: ${s.multi} 回<br>` +
    `認識にかかる時間 平均 <b>${(s.msSum / s.tries).toFixed(0)}</b> ミリ秒`;
}

function renderUsed() {
  document.getElementById('used').textContent = used.size ? [...used].join(' ') : '（まだありません）';
}

load();
</script>

</body>
</html>
