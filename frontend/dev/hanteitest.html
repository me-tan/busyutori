<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部首投げ 判定テスト</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    max-width: 560px; margin: 0 auto; padding: 20px;
    background: #f6f6f7; color: #16161a;
  }
  h1 { font-size: 17px; margin: 0 0 14px; }
  .card {
    background: #fff; border: 1px solid #e2e2e5; border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .radical-box { text-align: center; }
  .radical { font-size: 64px; line-height: 1.1; font-weight: 700; }
  .radical-name { font-size: 14px; color: #666; margin-top: 2px; }
  .radical-meaning { font-size: 13px; color: #888; }
  #can {
    border: 2px solid #333; border-radius: 8px; background: #fff;
    touch-action: none; display: block; margin: 0 auto; cursor: crosshair;
  }
  .btns { display: flex; gap: 8px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
  button {
    padding: 9px 16px; font-size: 14px; font-family: inherit; font-weight: 600;
    border: none; border-radius: 6px; cursor: pointer; background: #e6e6e9; color: #333;
  }
  button.primary { background: #2563eb; color: #fff; }
  .cands { font-size: 13px; color: #666; text-align: center; margin-top: 10px; word-break: break-all; }
  .cands b { font-size: 20px; color: #333; letter-spacing: 3px; }
  .verdict { text-align: center; font-size: 20px; font-weight: 700; margin-top: 10px; min-height: 30px; }
  .ok { color: #0a7d32; }
  .ng { color: #c22; }
  .ms { font-size: 12px; color: #999; text-align: center; }
  .used { font-size: 15px; line-height: 2; letter-spacing: 3px; word-break: break-all; }
  .label { font-size: 12px; color: #777; font-weight: 600; margin-bottom: 6px; }
  select { padding: 6px 8px; font-size: 14px; font-family: inherit; border-radius: 6px; border: 1px solid #ccc; }
  .note { font-size: 12px; color: #777; line-height: 1.8; }
  #status { font-size: 13px; }
</style>
</head>
<body>

<h1>部首投げ 判定テスト</h1>

<div class="card" id="status">読み込み中...</div>

<div class="card">
  <div class="label">難易度</div>
  <select id="level">
    <option value="low">初級（小1〜3）</option>
    <option value="elem" selected>中級（小1〜6）</option>
    <option value="all">上級（全常用）</option>
  </select>
  <button id="next" style="margin-left:8px">別の部首にする</button>
</div>

<div class="card radical-box">
  <div class="radical" id="radical">—</div>
  <div class="radical-name" id="radName"></div>
  <div class="radical-meaning" id="radMeaning"></div>
  <div class="ms" id="remain"></div>
</div>

<div class="card">
  <canvas id="can" width="300" height="300"></canvas>
  <div class="btns">
    <button id="undo">一画戻す</button>
    <button id="erase">全部消す</button>
    <button id="rec" class="primary">判定する</button>
  </div>
  <div class="cands" id="cands"></div>
  <div class="verdict" id="verdict"></div>
  <div class="ms" id="ms"></div>
</div>

<div class="card">
  <div class="label">使用済み漢字</div>
  <div class="used" id="used">（まだありません）</div>
</div>

<div class="card">
  <div class="note">
    <strong>確認すること</strong><br>
    ・正しく書いた漢字が「正解」になるか<br>
    ・部首が違う漢字を書いたとき、ちゃんと弾かれるか<br>
    ・一度使った漢字を再度書いたとき、弾かれるか<br>
    ・<strong>認識にかかる時間</strong>（下にミリ秒で出ます）<br>
    ・部首だけ書いて残りを殴り書きしたとき、何が起きるか
  </div>
</div>

<script src="kanji-canvas.js"></script>
<script src="ref-patterns.js"></script>
<script>
let DATA = null;
let currentRadical = null;
let used = new Set();

const GRADES = { low: ['1','2','3'], elem: ['1','2','3','4','5','6'], all: ['1','2','3','4','5','6','8'] };

async function load() {
  const st = document.getElementById('status');
  try {
    const res = await fetch('radicals.json');
    DATA = await res.json();
    st.innerHTML = `部首 ${DATA.meta.radicalCount} 種 / 漢字 ${DATA.meta.kanjiCount} 字 を読み込みました。`;
  } catch (e) {
    st.innerHTML = '<span style="color:#c22">radicals.json が読み込めません。</span><br>' +
      'このHTMLと同じフォルダに radicals.json / kanji-canvas.js / ref-patterns.js を置き、<br>' +
      '<code>python -m http.server</code> でローカルサーバーを立てて開いてください。<br>' +
      '（file:// で直接開くと fetch がブロックされます）';
    return;
  }
  KanjiCanvas.init('can');
  pickRadical();
}

// その難易度で出題可能な部首（残り漢字が一定数以上あるもの）
function availableRadicals() {
  const grades = GRADES[document.getElementById('level').value];
  const out = [];
  for (const [rad, d] of Object.entries(DATA.radicals)) {
    const pool = poolOf(rad, grades);
    if (pool.length >= 5) out.push(rad);
  }
  return out;
}

function poolOf(rad, grades) {
  const d = DATA.radicals[rad];
  let ks = [];
  for (const g of grades) if (d.kanji[g]) ks = ks.concat(d.kanji[g]);
  return ks;
}

function pickRadical() {
  const list = availableRadicals();
  currentRadical = list[Math.floor(Math.random() * list.length)];
  const d = DATA.radicals[currentRadical];
  document.getElementById('radical').textContent = currentRadical;
  document.getElementById('radName').textContent = d.name;
  document.getElementById('radMeaning').textContent = d.meaning;
  updateRemain();
  clearCanvas();
}

function updateRemain() {
  const grades = GRADES[document.getElementById('level').value];
  const pool = poolOf(currentRadical, grades);
  const left = pool.filter(k => !used.has(k)).length;
  document.getElementById('remain').textContent = `この部首の残り ${left} / ${pool.length} 字`;
}

function clearCanvas() {
  KanjiCanvas.erase('can');
  document.getElementById('cands').textContent = '';
  document.getElementById('verdict').textContent = '';
  document.getElementById('ms').textContent = '';
}

document.getElementById('erase').onclick = clearCanvas;
document.getElementById('undo').onclick = () => KanjiCanvas.deleteLast('can');
document.getElementById('next').onclick = pickRadical;
document.getElementById('level').onchange = () => { pickRadical(); };

document.getElementById('rec').onclick = () => {
  if (!DATA) return;
  const t0 = performance.now();
  const raw = KanjiCanvas.recognize('can');
  const elapsed = performance.now() - t0;

  // recognize は空白区切りの文字列を返す実装
  const cands = String(raw || '').trim().split(/\s+/).filter(Boolean);

  document.getElementById('cands').innerHTML = '候補: <b>' + cands.join('') + '</b>';
  document.getElementById('ms').textContent = elapsed.toFixed(0) + ' ミリ秒';

  const grades = GRADES[document.getElementById('level').value];
  const pool = new Set(poolOf(currentRadical, grades));

  // 候補の中から「その部首を含む・未使用」の漢字を探す
  const hit = cands.find(c => pool.has(c) && !used.has(c));
  const dupe = cands.find(c => pool.has(c) && used.has(c));

  const v = document.getElementById('verdict');
  if (hit) {
    v.textContent = `正解  ${hit}`;
    v.className = 'verdict ok';
    used.add(hit);
    renderUsed();
    updateRemain();
    setTimeout(clearCanvas, 900);
  } else if (dupe) {
    v.textContent = `「${dupe}」はもう使いました`;
    v.className = 'verdict ng';
  } else {
    v.textContent = `${currentRadical} の漢字ではありません`;
    v.className = 'verdict ng';
  }
};

function renderUsed() {
  const el = document.getElementById('used');
  el.textContent = used.size ? [...used].join(' ') : '（まだありません）';
}

load();
</script>

</body>
</html>
